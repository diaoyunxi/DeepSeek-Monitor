[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (informational)
]
ignore = [
    "S101",   # assert in tests is fine
    "PLR2004", # magic values are ok in scripts
    "PLR0913", # too many arguments is ok for CLI tools
    "PLR0915", # too many statements is ok for main scripts
    "S603",   # subprocess with shell=False is intentional
    "S607",   # partial executable paths are ok
]

[tool.ruff.lint.isort]
known-first-party = ["deepseek_monitor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
