name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: |
          # 统一使用 pyproject.toml 里的 [tool.ruff.lint] 规则集（select 覆盖 E,F,W,I,UP,B,S,RET,RUF，
          # 含原 --select F,E,S,B 的全部族）；原先硬编码 --select 会绕过项目已声明的 ignore，
          # 与 python-lint.yml 的判定互相矛盾。
          ruff check . --output-format=github

      - name: Security check with bandit
        run: |
          bandit -r . -f json -o bandit-report.json -q || true
          echo "Bandit scan completed"
